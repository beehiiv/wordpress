name: Deploy to WordPress.org

# Stable GitHub Releases only (not tag pushes or pre-releases), so beta tags
# can exist without deploying to WordPress.org.
on:
  release:
    types: [released]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2
          coverage: none

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Inject registration token
        env:
          BEEHIIV_REGISTRATION_TOKEN: ${{ secrets.BEEHIIV_REGISTRATION_TOKEN }}
        run: |
          if [ -z "$BEEHIIV_REGISTRATION_TOKEN" ]; then
            echo "BEEHIIV_REGISTRATION_TOKEN secret is not set"
            exit 1
          fi
          perl -pi -e 's/BEEHIIV_REGISTRATION_TOKEN_PLACEHOLDER/$ENV{BEEHIIV_REGISTRATION_TOKEN}/g' includes/OAuth/Config.php
          if grep -q 'BEEHIIV_REGISTRATION_TOKEN_PLACEHOLDER' includes/OAuth/Config.php; then
            echo "Failed to replace registration token placeholder"
            exit 1
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          # Remove or set to false after a successful dry-run.
          dry-run: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: beehiiv
