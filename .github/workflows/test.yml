name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "PHPUnit (PHP ${{ matrix.php.patch }}, WP ${{ matrix.wp-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php:
          - { series: "8.2", patch: "8.2.35" }
          - { series: "8.3", patch: "8.3.36" }
          - { series: "8.4", patch: "8.4.27" }
          - { series: "8.5", patch: "8.5.12" }
        wp-version: ["6.8", "latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          update: "true"
        with:
          php-version: ${{ matrix.php.patch }}
          tools: composer:v2
          coverage: none

      - name: Verify host PHP security version
        run: node scripts/check-php-version.js

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Pin wp-env PHP/WP core version
        run: npm run env:set-version -- --php=${{ matrix.php.series }} --wp=${{ matrix.wp-version }}

      - name: Start wp-env
        run: npm run env:start

      - name: Run PHPUnit
        run: npx wp-env run tests-cli -- bash -c "cd wp-content/plugins/$(basename "$GITHUB_WORKSPACE") && composer test"

      - name: Generate PHPUnit dashboard
        if: always()
        run: node tests/phpunit/report/generate-dashboard.js --label="PHP ${{ matrix.php.series }} / WP ${{ matrix.wp-version }}"

      - name: Upload PHPUnit dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report-php${{ matrix.php.series }}-wp${{ matrix.wp-version }}
          path: tests/phpunit/test-results
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          update: "true"
        with:
          php-version: "8.4.27"
          tools: composer:v2
          coverage: none

      - name: Verify host PHP security version
        run: node scripts/check-php-version.js

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Test PHP runtime safeguards
        run: npm run test:php-runtime

      - name: Build plugin assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npm run env:start

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/test-results
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
