name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inject-token-guard:
    name: Registration token inject
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Simulate WordPress.org token inject
        env:
          BEEHIIV_REGISTRATION_TOKEN: dummy-token-for-ci
        run: |
          bash scripts/inject-registration-token.sh
          grep -q "private const REGISTRATION_TOKEN = 'dummy-token-for-ci'" includes/OAuth/Config.php
          grep -q "'BEEHIIV_REGISTRATION_TOKEN_PLACEHOLDER' !== \$token" includes/OAuth/Config.php

  lint:
    name: Lint (${{ matrix.compatibility }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compatibility: "7.4", php: "8.4.27" }
          - { compatibility: "8.0", php: "8.4.27" }
          - { compatibility: "8.1", php: "8.4.27" }
          - { compatibility: "8.2", php: "8.2.35" }
          - { compatibility: "8.3", php: "8.3.36" }
          - { compatibility: "8.4", php: "8.4.27" }
          - { compatibility: "8.5", php: "8.5.12" }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup patched PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        env:
          update: "true"
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Verify host PHP security version
        run: node scripts/check-php-version.js

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Check PHP ${{ matrix.compatibility }}+ static compatibility
        run: npm run lint:php -- --runtime-set testVersion "${{ matrix.compatibility }}-"
